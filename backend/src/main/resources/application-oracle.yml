spring:
  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_DB_USER:NEWMEN}
    password: ${ORACLE_DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
app:
  seed:
    enabled: false
